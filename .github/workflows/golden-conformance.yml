name: Reference validator golden conformance

on:
  push:
  pull_request:

jobs:
  golden-conformance:
    runs-on: ubuntu-latest
    env:
      # pending maintainer disposition: these registry codes are not implemented.
      GOLDEN_FIXTURE_EXCLUSIONS: R015,R016,R019,R020
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Schema validation
        run: python -m compileall validators
      - name: Golden conformance (fixture coverage excludes pending codes)
        run: python -m pytest -q tests/test_golden_fixtures.py
      - name: Hasher and immutability checks
        run: echo "Hasher/immutability stage reserved for release pipeline"
