[meta]
artifact              = "NOMENCLATURE.toml"
standard_name         = "SLML"
standard_version      = "v0.1"
standard_codename     = "hawkseye"
governance_version    = "1.0"
status                = "NORMATIVE"
authority             = "branch:release-v0.1--hawkseye"
fail_closed           = true

# ─────────────────────────────────────────────
# 1. STANDARD IDENTITY STRINGS
# ─────────────────────────────────────────────

[identity]
full_name             = "Structural Legitimacy Manifest Language"
short_name            = "SLML"
version               = "0.1"
version_prefixed      = "v0.1"
codename              = "hawkseye"
release_series        = "v0.1--hawkseye"
version_codename_sep  = "--"

[identity.rules]
short_name_casing     = "ALL_CAPS"
codename_casing       = "lowercase"
codename_no_spaces    = true
version_prefix        = "v"
version_codename_separator = "double_dash"


# ─────────────────────────────────────────────
# 2. BRANCH NAMING
# ─────────────────────────────────────────────

[branches]
release_branch_format         = "release-v{version}--{codename}"
release_branch_example        = "release-v0.1--hawkseye"
authority_reference_format    = "branch:release-v{version}--{codename}"
authority_reference_example   = "branch:release-v0.1--hawkseye"

[branches.rules]
prefix                        = "release-"
prefix_casing                 = "lowercase"
separator_version_to_codename = "double_dash"
codename_casing               = "lowercase"
codename_no_spaces            = true
version_prefix_required       = true


# ─────────────────────────────────────────────
# 3. GIT TAG FORMAT
# ─────────────────────────────────────────────

[tags]
format                = "slml-v{version}"
example               = "slml-v0.1"
prefix                = "slml-"
version_prefix        = "v"

[tags.rules]
casing                = "lowercase"
separator             = "-"
version_prefix_required = true


# ─────────────────────────────────────────────
# 4. FILE NAMING BY CLASS
# ─────────────────────────────────────────────

[file_classes.authoritative_toml]
description           = "Normative authoritative artifacts"
format                = "ALL_CAPS.toml"
extension             = ".toml"
casing                = "ALL_CAPS"
version_prefix        = false
location              = "branch:release-v0.1--hawkseye only"
may_be_normative_input = true
may_be_hashed         = true
examples              = [
  "SPEC.toml",
  "GOVERNANCE.toml",
  "IMMUTABILITY.toml",
  "RELEASE_METADATA.toml",
  "HASH_POLICY.toml",
  "NOMENCLATURE.toml",
  "ERROR_CODES.toml",
  "GLOSSARY.toml",
  "NORMATIVE_EXAMPLES.toml",
  "NON_COMPLIANT_PATTERNS.toml",
  "NOTICE.toml",
  "VERSION.toml",
  "CHANGELOG.toml",
  "LICENSE_CODE.toml",
  "LICENSE_SPEC.toml",
  "SPEC_SCHEMA.toml"
]
violations            = [
  "lowercase_name",
  "mixed_case_name",
  "version_prefix_on_toml",
  "toml_outside_release_branch"
]

[file_classes.versioned_validator]
description           = "Canonical Python validator — normative executable"
format                = "v{version}_SLML_validator.py"
extension             = ".py"
casing_prefix         = "v{version}_"
casing_acronym        = "ALL_CAPS"
casing_suffix         = "snake_case"
example               = "v0.1_SLML_validator.py"
location              = "branch:release-v0.1--hawkseye"
may_be_normative_input = true
may_be_hashed         = true
violations            = [
  "SLML_validator_v01.py",
  "slml_validator.py",
  "SLML_validator_v0.1.py",
  "validator_v01.py"
]

[file_classes.docs_mirror]
description           = "Non-normative human-facing mirror of an authoritative .toml file"
convention            = "SAME_BASENAME_TXT"
format                = "{SAME_BASENAME_AS_TOML}.txt"
extension             = ".txt"
casing                = "SAME_AS_SOURCE_TOML_BASENAME"
version_prefix        = false
location              = "docs/"
may_be_normative_input = false
may_be_hashed         = false
cardinality           = "exactly_one_mirror_per_authoritative_toml"
examples              = [
  "SPEC.txt",
  "GOVERNANCE.txt",
  "IMMUTABILITY.txt",
  "NOMENCLATURE.txt",
  "ERROR_CODES.txt",
  "GLOSSARY.txt",
  "NORMATIVE_EXAMPLES.txt",
  "NON_COMPLIANT_PATTERNS.txt",
  "NOTICE.txt",
  "VERSION.txt",
  "CHANGELOG.txt",
  "LICENSE_CODE.txt",
  "LICENSE_SPEC.txt",
  "SPEC_SCHEMA.txt",
  "HASH_POLICY.txt",
  "RELEASE_METADATA.txt"
]
violations            = [
  "IMMUTABILITY_toml.txt",
  "GLOSSARY_EXPLAINED.txt",
  "ERROR_CODES_EXPLAINED.txt",
  "adding_toml_suffix_to_basename",
  "adding_EXPLAINED_suffix_to_basename"
]

[file_classes.standalone_informative_doc]
description           = "Non-normative standalone informative document with no TOML counterpart"
format                = "DESCRIPTIVE_NAME.txt"
extension             = ".txt"
casing                = "ALL_CAPS_OR_MIXED_DESCRIPTIVE"
version_prefix        = false
location              = "docs/ or root"
may_be_normative_input = false
may_be_hashed         = false
cardinality           = "not_subject_to_mirror_cardinality_check"
examples              = [
  "COMPLIANCE_CLAIM_POLICY.txt",
  "COMPLIANCE_EXPLAINED.txt",
  "EXECUTIVE_COMPLIANCE.txt",
  "FAQ.txt",
  "OVERVIEW.txt",
  "WORKED_EXAMPLE_LYRIC_WORKFLOW.txt",
  "README.txt"
]

[file_classes.readme_index]
description           = "Repository or directory index file"
format                = "README.txt"
extension             = ".txt"
casing                = "ALL_CAPS"
version_prefix        = false
may_be_normative_input = false
may_be_hashed         = false

[file_classes.raw_template]
description           = "Normative template — defines required structure but is not an executable implementation"
format                = "{descriptive_name}.RAW"
extension             = ".RAW"
casing                = "lowercase_snake or v{short_version}_descriptive"
version_prefix        = "optional"
may_be_normative_input = false
may_be_hashed         = false
normative_as          = "structure_and_field_semantics_only"
examples              = [
  "v01_validator_py.RAW",
  "v01_docs_json.RAW"
]

[file_classes.versioned_json]
description           = "Versioned structured derivative — non-normative, TOML-aligned"
format                = "v{version}_{UPPER_NAME}.json"
extension             = ".json"
casing_prefix         = "v{version}_"
casing_name           = "UPPER"
may_be_normative_input = false
may_be_hashed         = false
must_be_toml_aligned  = true
examples              = [
  "v0.1_ADMISSIBLE_MANIFEST.json",
  "v01_binded_manifest.json"
]

[file_classes.versioned_binding_txt]
description           = "Versioned normative binding artifact — plain text"
format                = "v{short_version}_{DESCRIPTIVE_NAME}.txt"
extension             = ".txt"
casing_prefix         = "v{short_version}_"
casing_name           = "UPPER_OR_DESCRIPTIVE"
may_be_normative_input = false
may_be_hashed         = false
examples              = [
  "v01_binded_claims.txt",
  "v01_evidence_binding.txt",
  "v01_manifest_binding.txt"
]


# ─────────────────────────────────────────────
# 5. REQUIRED NORMATIVE ARTIFACTS ON RELEASE BRANCH
# ─────────────────────────────────────────────

[release_artifacts]
required_normative_artifacts = [
  "SPEC.toml",
  "SPEC_SCHEMA.toml",
  "VERSION.toml",
  "ERROR_CODES.toml",
  "GLOSSARY.toml",
  "NORMATIVE_EXAMPLES.toml",
  "NON_COMPLIANT_PATTERNS.toml",
  "HASH_POLICY.toml",
  "IMMUTABILITY.toml",
  "NOTICE.toml",
  "RELEASE_METADATA.toml",
  "LICENSE_CODE.toml",
  "LICENSE_SPEC.toml",
  "GOVERNANCE.toml",
  "CHANGELOG.toml",
  "NOMENCLATURE.toml",
  "v0.1_SLML_validator.py"
]

[release_artifacts.rules]
all_toml_artifacts_must_be_ALL_CAPS       = true
validator_must_carry_version_prefix       = true
missing_artifact_blocks_release           = true
artifact_list_is_exhaustive               = true


# ─────────────────────────────────────────────
# 6. COMPLIANCE CLAIM REFERENCE STRINGS
# ─────────────────────────────────────────────

[compliance_claim]
standard_reference_format   = "SLML/{version}({codename})"
standard_reference_example  = "SLML/0.1(hawkseye)"
hash_format                 = "sha256:{hex_lower}"
hash_example                = "sha256:<64-char-hex>"

[compliance_claim.prohibited_phrases_without_evidence]
phrases = [
  "SLML-aligned",
  "SLML-inspired",
  "Designed with SLML principles",
  "Certified under SLML"
]

[compliance_claim.required_fields]
fields = [
  "slml_version_exact",
  "validator_version_exact",
  "manifest_hash",
  "result"
]


# ─────────────────────────────────────────────
# 7. HASHING
# ─────────────────────────────────────────────

[hashing]
algorithm                   = "SHA256"
encoding                    = "hex_lower"
canonicalization_required   = true
output_file                 = "HASHES.sha256"
symlinks_prohibited         = true
scope_include_globs         = ["branch:release-v0.1--hawkseye/**/*.toml"]
scope_exclude_globs         = ["branch:release-v0.1--hawkseye/docs/**"]

[hashing.rules]
hash_before_tag             = true
hash_scope_is_exhaustive    = true
no_implicit_inclusion       = true
no_implicit_omission        = true


# ─────────────────────────────────────────────
# 8. EPISTEMIC STATUS BY EXTENSION
# ─────────────────────────────────────────────

[[epistemic_status]]
extension               = ".toml"
status                  = "authoritative"
normative_input         = true
hashable                = true
condition               = "only when located on branch:release-v0.1--hawkseye"

[[epistemic_status]]
extension               = ".txt"
status                  = "draft_or_explicative_non_normative"
normative_input         = false
hashable                = false
condition               = "location_may_be_anywhere"

[[epistemic_status]]
extension               = ".json"
status                  = "structured_derivative_non_normative"
normative_input         = false
hashable                = false
condition               = "must_be_toml_aligned"

[[epistemic_status]]
extension               = ".RAW"
status                  = "normative_template_structure_only"
normative_input         = false
hashable                = false
condition               = "normative_as_structure_not_implementation"

[[epistemic_status]]
extension               = ".py"
status                  = "normative_executable"
normative_input         = true
hashable                = true
condition               = "only v0.1_SLML_validator.py on release branch; all others non-normative"


# ─────────────────────────────────────────────
# 9. DIRECTORY AUTHORITY MAP
# ─────────────────────────────────────────────

[[directory_map]]
path                    = "."
role                    = "non_authoritative_drafting_mirror"
authoritative           = false

[[directory_map]]
path                    = "docs/"
role                    = "non_normative_human_facing_mirrors_and_standalone_docs"
authoritative           = false

[[directory_map]]
path                    = "validators/"
role                    = "non_normative_validator_implementations"
authoritative           = false

[[directory_map]]
path                    = "schemas/"
role                    = "non_normative_schema_derivatives"
authoritative           = false

[[directory_map]]
path                    = "manifests/"
role                    = "non_normative_example_manifests"
authoritative           = false

[[directory_map]]
path                    = "tools/"
role                    = "release_utilities"
authoritative           = false

[[directory_map]]
path                    = "appendix/"
role                    = "non_normative_examples_and_guides"
authoritative           = false

[[directory_map]]
path                    = "contributors/"
role                    = "contributor_scaffolding"
authoritative           = false

[[directory_map]]
path                    = "versions/v0.1_hawkseye_prerelease_staging/"
role                    = "staging_source_for_release_promotion"
authoritative           = false
note                    = "Staging only — becomes authoritative only after explicit promotion to release branch"

[[directory_map]]
path                    = "branch:release-v0.1--hawkseye"
role                    = "canonical_release_root_sole_authority"
authoritative           = true


# ─────────────────────────────────────────────
# 10. PROMOTION PATH
# ─────────────────────────────────────────────

[promotion]
allowed = [
  "draft_to_release_via_explicit_copy_and_hash"
]
prohibited = [
  "implicit_promotion_by_reference",
  "promotion_by_symlink",
  "promotion_by_tool_default_paths",
  "promotion_by_readme_claims"
]

[promotion.rules]
authority_cannot_be_created_by_implication  = true
promotion_requires_hash                     = true
promotion_requires_tag                      = true
promotion_requires_immutability_declaration = true


# ─────────────────────────────────────────────
# 11. INVARIANTS
# ─────────────────────────────────────────────

[invariants]
one_canonical_release_root                  = true
no_multiple_authority_roots                 = true
no_implicit_promotion                       = true
no_symlinks_in_normative_surface            = true
no_dotted_keys_in_manifests                 = true
docs_mirrors_exact_cardinality_match        = true
docs_mirror_same_basename_only              = true
governance_changes_require_version_bump     = true
semantic_changes_require_new_release_branch = true
naming_violations_are_structural_errors     = true
