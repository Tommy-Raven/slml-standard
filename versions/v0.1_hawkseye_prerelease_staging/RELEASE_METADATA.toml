[meta]
standard_name = "SLML"
artifact = "RELEASE_METADATA.toml"
governance_version = "1.0"
metadata_schema_version = "1.0"
status = "NORMATIVE"

[release]
version = "v0.1"
codename = "hawkseye"
canonical_release_root = "branch:release-v0.1--hawkseye"

# Populated at freeze time
tag = "slml-v0.1"
commit_hash = "<TO_BE_SET_AT_FREEZE>"
freeze_timestamp_utc = "<TO_BE_SET_AT_FREEZE>"

[hash]
algorithm = "SHA256"
encoding = "hex_lower"
canonicalization = true
release_hash = "<TO_BE_SET_AT_FREEZE>"

[immutability]
declared_immutable = true
immutability_policy_file = "IMMUTABILITY.toml"
hash_policy_file = "HASH_POLICY.toml"

[validator]
validator_version = "1.0"
target_slml_version = "v0.1"
deterministic = true
fail_closed = true

[schema]
spec_schema = "SPEC_SCHEMA.toml"
schema_version = "1.0"

[authority]
authority_model = "branch-based"
release_branch = "release-v0.1--hawkseye"
authority_locked_by = [
  "tag",
  "commit_hash",
  "release_hash",
  "immutability_policy",
  "governance_version"
]

[contents]
required_normative_artifacts = [
  "SPEC.toml",
  "SPEC_SCHEMA.toml",
  "VERSION.toml",
  "ERROR_CODES.toml",
  "GLOSSARY.toml",
  "NORMATIVE_EXAMPLES.toml",
  "NON_COMPLIANT_PATTERNS.toml",
  "HASH_POLICY.toml",
  "IMMUTABILITY.toml",
  "NOTICE.toml",
  "RELEASE_METADATA.toml",
  "LICENSE_CODE.toml",
  "LICENSE_SPEC.toml",
  "GOVERNANCE.toml",
  "CHANGELOG.toml",
  "NOMENCLATURE.toml",
  "v0.1_SLML_validator.py"
]

[signatures]
# Optional for v0.1
signing_required = false
signatures = []
