# Automatically apply labels to pull requests based on changed file paths.
# Requires a .github/labeler.yml configuration file in the repository.

name: PR Labeler

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  apply-labels:
    runs-on: ubuntu-latest

    steps:
      - name: Apply labels based on file changes
        uses: actions/labeler@v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
