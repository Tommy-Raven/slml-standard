[slml_governance]
version = "v0.1"
codename = "hawkseye"
status = "frozen"
release_case = "lowercase"
codename_no_spaces = true
immutability = true
append_only = true

[repository_structure]
root_authority = "non_authoritative"
normative_authority_path = "branch:release-v<version>--<codename>"
governance_file = "GOVERNANCE.toml"
self_manifest_required = true

[release]
version              = "v0.1"
codename             = "hawkseye"
release_branch       = "release-v0.1--hawkseye"
canonical_release_root = "branch:release-v0.1--hawkseye"
tag                  = "<TO_BE_SET_AT_FREEZE>"
commit_hash          = "<TO_BE_SET_AT_FREEZE>"
freeze_timestamp_utc = "<TO_BE_SET_AT_FREEZE>"
release_hash         = "<TO_BE_SET_AT_FREEZE>"
hash_algorithm       = "SHA256"
hash_encoding        = "hex_lower"

[governance]
purpose = "Preserve immutable standard releases and prevent semantic drift"

[governance.immutability]
released_versions_immutable   = true
modifiable_paths_after_release = []
forbidden_modifications        = [
    "branch:release-vX.Y--*/**"
]

[governance.authority]
normative_authority_path       = "branch:release-v<version>--<codename>"
external_interpretive_authority = false
documentation_authoritative    = false
semantic_authority_centralized = true
semantic_authority_location    = "normative_text_only"

[governance.version_creation]
required_files = [
    "SPEC.toml",
    "SPEC_SCHEMA.toml",
    "VERSION.toml",
    "ERROR_CODES.toml",
    "GLOSSARY.toml",
    "NORMATIVE_EXAMPLES.toml",
    "NON_COMPLIANT_PATTERNS.toml",
    "HASH_POLICY.toml",
    "IMMUTABILITY.toml",
    "NOTICE.toml",
    "GOVERNANCE.toml",
    "CHANGELOG.toml",
    "LICENSE_CODE.toml",
    "LICENSE_SPEC.toml",
    "SELF_MANIFEST.toml",
    "SLML_validator_v0.1.py"
]
self_manifest_validation_required  = true
release_blocked_without_validation = true
new_version_required_for_semantic_change = true
no_in_place_revision               = true

[governance.contributions.allowed]
new_versions            = true
non_normative_tooling   = true
documentation_updates   = true
additional_validators   = true

[governance.contributions.forbidden]
modify_released_artifacts                    = true
semantic_clarifications_without_new_version  = true
validator_inference_or_defaults              = true
retroactive_semantic_adjustment              = true

[governance.disputes]
resolution_order = [
    "normative_text",
    "self_manifest_validation_behavior"
]
ambiguity_resolution_method   = "new_version_only"
interpretation_freeze_on_release = true

[governance.release_process]
hash_generation_required      = true
hash_tool                     = "tools/hash_release.py"
hash_output_file              = "HASHES.sha256"
git_tag_required              = true
tag_format                    = "slml-v0.1--hawkseye"
tag_format_template           = "slml-vX.Y--codename"
github_release_recommended    = true
release_hashes_must_match_tag = true
release_blocked_on_hash_mismatch = true

[governance.maintainers]
operational_control_only      = true
semantic_authority            = false
cannot_override_normative_text = true

[file_classes]

[file_classes.authoritative]
extensions               = ["toml"]
location_must_be_under   = ["branch:release-v0.1--hawkseye"]
may_be_used_as_normative_input    = true
may_be_hashed_for_release_integrity = true
modifications_after_release_prohibited = true

[file_classes.non_normative_executable]
extensions             = ["py"]
location_must_be_under = ["branch:release-v0.1--hawkseye"]
may_be_used_as_normative_input    = false
may_be_hashed_for_release_integrity = true
note = "Validators are non-normative implementations; their behavior must conform to normative TOML invariants"

[file_classes.docs_mirror]
extensions               = ["txt"]
category                 = "mirror"
location_may_be_anywhere = true
must_be_non_executable   = true
may_be_used_as_normative_input      = false
may_be_hashed_for_release_integrity = false
required_per_authoritative_toml     = true
naming_convention                   = "SAME_BASENAME_TXT"

[file_classes.docs_standalone]
extensions               = ["txt"]
category                 = "standalone_informative"
location_may_be_anywhere = true
must_be_non_executable   = true
may_be_used_as_normative_input      = false
may_be_hashed_for_release_integrity = false
required_per_authoritative_toml     = false
examples = [
    "FAQ.txt",
    "OVERVIEW.txt",
    "COMPLIANCE_EXPLAINED.txt",
    "COMPLIANCE_CLAIM_POLICY.txt",
    "EXECUTIVE_COMPLIANCE.txt",
    "WORKED_EXAMPLE_LYRIC_WORKFLOW.txt"
]

[file_classes.structured_non_normative]
extensions             = ["json"]
location_may_be_anywhere = true
must_be_toml_aligned   = true
may_be_used_as_normative_input      = false
may_be_hashed_for_release_integrity = false

[file_classes.normative_template]
extensions             = ["RAW"]
location_may_be_anywhere = true
may_be_used_as_normative_input      = false
may_be_hashed_for_release_integrity = false
note = "RAW files define required structure and semantics; not authoritative validators on their own"


[docs]
docs_root                     = "branch:release-v0.1--hawkseye/docs"
docs_are_non_normative        = true
docs_are_verbose_human_facing = true

[docs.mirrors]
cardinality                   = "one_per_authoritative_toml"
naming_convention             = "SAME_BASENAME_TXT"
must_not_introduce_new_rules  = true
orphan_mirrors_prohibited     = true

[docs.standalone]
permitted                     = true
must_not_introduce_new_rules  = true
normative_citation_prohibited = true

[docs.invariant_checks]
required = [
    "cardinality_match_mirrors_only",
    "basename_correspondence_mirrors_only",
    "no_orphan_mirrors",
    "no_undocumented_authoritative_toml",
    "standalone_docs_not_counted_in_mirror_cardinality"
]

[promotion]
promotion_paths_allowed = [
    "draft_to_release_via_explicit_copy_and_hash"
]
promotion_paths_prohibited = [
    "implicit_promotion_by_reference",
    "promotion_by_symlink",
    "promotion_by_tool_default_paths",
    "promotion_by_readme_claims",
    "promotion_by_directory_rename"
]
promotion_requires_hash_verification   = true
promotion_requires_self_manifest_pass  = true
promotion_requires_all_required_files  = true
staging_dir                            = "versions/v0.1_hawkseye_prerelease_staging"
release_branch                         = "release-v0.1--hawkseye"

[compliance]
validator_must_enforce_governance         = true
validator_must_fail_on_immutability_violation = true
validator_must_not_assume_defaults        = true
recursive_validation_required             = true
cross_version_isolation_required          = true

[immutability_guarantees]
released_versions_locked  = true
hash_sealed               = true
append_only_history       = true
no_rewrite_of_git_history = true
