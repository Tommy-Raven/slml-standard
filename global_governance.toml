[global_authority]

canonic_version = "v0.1.0"
owner_legal_name = "Thomas Byers"
owner_operational_name = "Tommy Raven"
all_rights_reserved = true
nda_presumed = true
redistribution_prohibited_without_written_authorization = true
publication_assumed_false = true
copyright_automatic = true

[epistemic_integrity]

fabrication_prohibited = true
speculation_must_be_explicitly_labeled = true
non_inferential_mode_default = true
assumption_declaration_required = true
ambiguity_flag_required = true
halt_on_uncertainty_required = true
context_drift_prohibited = true
scope_drift_prohibited = true
goal_substitution_prohibited = true
implicit_reinterpretation_prohibited = true

[editing_governance]

append_only_required = true
deletion_prohibited = true
reordering_prohibited = true
silent_rewrite_prohibited = true
structural_refactor_without_approval_prohibited = true
diff_style_proposal_required = true
explicit_approval_required_before_implementation = true
edit_justification_required = true

[file_system_doctrine]

authoritative_extension = ".toml"
secondary_derivative_extension = ".json"
non_normative_explicative_extension = ".txt"
normative_markdown_prohibited = true
yaml_authoritative_prohibited = true
inline_comments_in_normative_prohibited = true
companion_explicative_required = true
directory_readme_required = true
template_label_non_normative_authoritative_only = true

[validation_traceability]

deterministic_structures_required = true
explicit_field_definitions_required = true
implied_defaults_prohibited = true
assumptions_must_be_identified = true
constraints_must_be_identified = true
validation_logic_must_be_exposed = true

[operational_efficiency]

verbosity_inflation_prohibited = true
redundancy_prohibited = true
ornamental_markdown_prohibited = true
duplicate_content_prohibited = true
compression_without_permission_prohibited = true

[behavioral_constraints]

psychological_profiling_prohibited = true
motive_inference_prohibited = true
stylistic_embellishment_without_instruction_prohibited = true
metaphor_in_normative_documents_prohibited = true
governance_philosophy_injection_without_request_prohibited = true

[slml_sswg_minimum_alignment]

voluntary_submission_model_required = true
recursive_validation_required = true
append_only_branch_logic_required = true
historical_timestamp_immutable = true
retroactive_modification_prohibited = true
deprecation_append_only_required = true
explicit_deprecation_label_required = true

[v0_1_slml_global_governance]

version = "v0.1"
codename = "hawkseye"
status = "frozen"
release_case = "lowercase"
codename_no_spaces = true
immutability = true
append_only = true

[repository_structure]

root_authority = "non_authoritative_non_normative"
root_readme_must_declare_non_authoritative = true
normative_artifacts_in_root_permitted = false
standards_released_directory_persistent = false
authoritative_material_post_release = "branch_only"

[branch_release_model]

branch_type = "versioned_codename_immutable_branch"
temporal_snapshot = true
immutable_after_tag = true
hash_required = true
signature_required = true
tag_required = true
name_required = true
force_push_allowed = false
merge_allowed = false
rebase_allowed = false
direct_push_allowed = false

[pull_request_governance]

draft_pr_required = true
duly_named_title_required = true
sole_caretaker_review = true
caretaker_cannot_bypass_rules = true

[validator_authority]

ultimate_absolute_artifact = "v.X.x_codename.py"
binary_return_required = true
deterministic = true
recursive_validator_model = true

[validator_outcomes]

admissible = true
corrupted = true
additional_outcomes_permitted = false

[certification_requirements]

hash_present = true
signature_present = true
tag_present = true
named_release_present = true
missing_any_factor_non_admissible = true
unauthorized_slml_certification_prohibited = true

[validator_flaw_handling]

historical_timestamps_immutable = true
retroactive_modification_forbidden = true
deprecated_tag_append_only = true
explicit_disclaimer_required = true
new_release_required_for_fix = true

[json_derivatives]

permitted_extension = ".json"
authority_status = "non_authoritative_normative_supplement"
schema_aligned_required = true
validator_logic_aligned_required = true
instantiated_json_frozen = true
immutability_enforced = true

[submitter_responsibility]

voluntary_resubmission_required_on_deprecation = true
validity_maintenance_required = true

[licensing_enforcement]

unauthorized_use_of_slml_certified_terms_prohibited = true
non_admissible_certification_invalid = true
